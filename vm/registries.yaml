# k3s containerd registry configuration
#
# This file must be placed at /etc/rancher/k3s/registries.yaml inside the
# Lima VM, then k3s restarted. The bootstrap-mesh.sh script does this.
#
# Both names route to the same registry (registry:2 in mesh-system, NodePort 30500).
# localhost:30500 is reachable from the k3s node inside Lima.
#
# registry.local:5000         — legacy alias; used in existing manifests and
#                               by deploy scripts pushing from outside the cluster.
# registry.mesh-system.svc.cluster.local:5000 — the in-cluster DNS name that
#                               buildkitd (a pod) now uses when tagging images.
#                               containerd can't resolve cluster DNS, so we map
#                               it to the NodePort here.
mirrors:
  "registry.local:5000":
    endpoint:
      - "http://localhost:30500"
  "registry.mesh-system.svc.cluster.local:5000":
    endpoint:
      - "http://localhost:30500"
